<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <iframe id="verification"></iframe>

    <script>
        const parts = window.location.pathname
            .split('/')
            .filter(Boolean);

        const certificateId = parts[parts.length - 1];

        document.getElementById('verification').src =
            `https://eliteoffshore.info/verification/${encodeURIComponent(certificateId)}`;
    </script>

</body>
</html>
