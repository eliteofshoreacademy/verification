<!DOCTYPE html>
<html>
<body style="margin: 0;">

<iframe
    src=""
    id="verification"
    style="width: 100%; height: 100vh; border: 0;"
></iframe>

<script>
    const certificateId =
        new URLSearchParams(window.location.search).get('cert');

    const iframe = document.getElementById('verification');

    iframe.src =
        'https://eliteoffshore.info/verification/' +
        encodeURIComponent(certificateId);
</script>

</body>
</html>
